services:
  - type: web
    name: manga-mini-app
    runtime: python
    plan: free
    buildCommand: pip install -r manga_app/requirements.txt
    startCommand: python manga_app/server.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
