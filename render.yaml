services:
  - type: web
    name: phone-shop-mini-app
    runtime: python
    plan: free
    buildCommand: pip install -r shop_app/requirements.txt
    startCommand: python shop_app/server.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ADMIN_CHAT_ID
        sync: false
