<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Manga</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#0f0f14);
  --bg2:var(--tg-theme-secondary-bg-color,#1a1a22);
  --text:var(--tg-theme-text-color,#f2f2f5);
  --hint:var(--tg-theme-hint-color,#8a8a99);
  --accent:var(--tg-theme-button-color,#7c5cff);
  --accent-text:var(--tg-theme-button-text-color,#fff);
  --link:var(--tg-theme-link-color,#9b85ff);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{padding:12px 14px}
h2{font-size:18px;margin:18px 0 10px;display:flex;justify-content:space-between;align-items:center}
h2 small{font-size:13px;font-weight:400;color:var(--link)}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;padding:11px 14px;border-radius:12px;border:0;background:var(--bg2);color:var(--text);font:inherit;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 13px;border-radius:999px;background:var(--bg2);font-size:13px}
.chip.on{background:var(--accent);color:var(--accent-text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px 10px}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:104px;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.row::-webkit-scrollbar{display:none}
.card .cv{aspect-ratio:2/3;border-radius:10px;background:var(--bg2) center/cover no-repeat;position:relative;overflow:hidden}
.card .cv span{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 5px;font-size:11px;background:linear-gradient(transparent,#000c);color:#fff}
.card .t{font-size:13px;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;background:var(--accent);color:var(--accent-text);font-weight:600}
.btn.ghost{background:var(--bg2);color:var(--text)}
.more{display:block;width:100%;margin:16px 0}
.muted{color:var(--hint);font-size:13px}
.center{text-align:center;padding:40px 10px;color:var(--hint)}
.spin{width:28px;height:28px;margin:30px auto;border:3px solid var(--bg2);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.hero{display:flex;gap:14px}
.hero .cv{width:120px;flex:none;aspect-ratio:2/3;border-radius:12px;background:var(--bg2) center/cover}
.hero h1{font-size:19px;margin:0 0 6px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tags span{font-size:12px;padding:4px 9px;border-radius:8px;background:var(--bg2);color:var(--hint)}
.desc{font-size:14px;color:var(--text);opacity:.88;white-space:pre-line;max-height:6.9em;overflow:hidden;position:relative}
.desc.open{max-height:none}
.actions{display:flex;gap:8px;margin:14px 0}
.actions .btn:first-child{flex:1}
.ch{display:flex;justify-content:space-between;gap:10px;padding:12px 4px;border-bottom:1px solid var(--bg2)}
.ch.read{opacity:.5}
.ch b{font-weight:500}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg2);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav a{flex:1;text-align:center;padding:9px 0 8px;font-size:11px;color:var(--hint)}
.nav a i{display:block;font-style:normal;font-size:20px}
.nav a.on{color:var(--accent)}
.reader img{display:block;width:100%;min-height:200px;background:var(--bg2)}
.reader img.ok{min-height:0;background:none}
.rbar{position:sticky;top:0;z-index:4;background:var(--bg);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.rnav{display:flex;gap:8px;padding:14px}
.rnav .btn{flex:1}
.hide-nav .nav{display:none}
.hide-nav{padding-bottom:0}
select{background:var(--bg2);color:var(--text);border:0;border-radius:10px;padding:8px 10px;font:inherit}
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav" id="nav">
  <a href="#/" data-k="home"><i>🏠</i>Asosiy</a>
  <a href="#/catalog" data-k="catalog"><i>🔍</i>Katalog</a>
  <a href="#/library" data-k="library"><i>❤️</i>Kutubxona</a>
</nav>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
try { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('bg_color'); } catch(e){}
const $app = document.getElementById('app');
const RATING = '&contentRating[]=safe&contentRating[]=suggestive';
const LANGS = {uz:"O'zbek", ru:'Русский', en:'English'};
const store = {
  get(k, d){ try { const v = localStorage.getItem('m_'+k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('m_'+k, JSON.stringify(v)); } catch(e){} }
};
let lang = store.get('lang', 'ru');
const S = { chapters:{}, manga:{}, tags:null };

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img = u => '/img?u=' + encodeURIComponent(u);
async function api(path){
  const r = await fetch('/api/md/' + path);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
const haptic = () => { try { tg.HapticFeedback.impactOccurred('light'); } catch(e){} };
const spinner = '<div class="spin"></div>';
const errBox = msg => `<div class="center">😔 ${esc(msg||'Xatolik yuz berdi')}<br><br><button class="btn ghost" onclick="route()">Qayta urinish</button></div>`;

function pick(obj){ if(!obj) return ''; return obj[lang] || obj.en || obj['ja-ro'] || Object.values(obj)[0] || ''; }
function mangaInfo(m){
  const a = m.attributes;
  let title = '';
  for (const alt of a.altTitles || []) if (alt[lang]) { title = alt[lang]; break; }
  title = title || a.title.en || Object.values(a.title)[0] || 'Nomsiz';
  const cov = (m.relationships||[]).find(r => r.type==='cover_art');
  const cover = cov && cov.attributes ? img(`https://uploads.mangadex.org/covers/${m.id}/${cov.attributes.fileName}.256.jpg`) : '';
  return { id:m.id, title, cover, a };
}
function card(info, sub){
  return `<a class="card" href="#/manga/${info.id}"><div class="cv" style="background-image:url('${info.cover}')">${sub?`<span>${esc(sub)}</span>`:''}</div><div class="t">${esc(info.title)}</div></a>`;
}
function listQuery(order, extra=''){
  return `manga?limit=24&includes[]=cover_art${RATING}&availableTranslatedLanguage[]=${lang}&hasAvailableChapters=true&order[${order}]=desc${extra}`;
}
function langChips(){
  return `<div class="chips">${Object.entries(LANGS).map(([k,v])=>`<button class="chip ${k===lang?'on':''}" onclick="setLang('${k}')">${v}</button>`).join('')}</div>`;
}
function setLang(l){ lang = l; store.set('lang', l); S.chapters = {}; haptic(); route(); }

// ---------- Views ----------
async function viewHome(){
  const hist = Object.values(store.get('hist', {})).sort((a,b)=>b.t-a.t).slice(0,12);
  $app.innerHTML = `<div class="wrap">
    <form class="search" onsubmit="event.preventDefault();location.hash='#/catalog?q='+encodeURIComponent(this.q.value)">
      <input name="q" placeholder="🔍 Manga qidirish..." enterkeyhint="search"></form>
    <div style="margin-top:10px">${langChips()}</div>
    ${hist.length ? `<h2>📖 Davom ettirish</h2><div class="row">${hist.map(h=>card(h, h.label)).join('')}</div>` : ''}
    <h2>🔥 Mashhur <small onclick="location.hash='#/catalog?s=followedCount'">Hammasi ›</small></h2><div class="row" id="pop">${spinner}</div>
    <h2>🆕 Yangi boblar <small onclick="location.hash='#/catalog?s=latestUploadedChapter'">Hammasi ›</small></h2><div class="grid" id="new">${spinner}</div>
  </div>`;
  const fill = async (id, order) => {
    const el = document.getElementById(id);
    try {
      const d = await api(listQuery(order));
      if (!document.body.contains(el)) return;
      el.innerHTML = d.data.length ? d.data.map(m => card(mangaInfo(m))).join('') : '<div class="muted">Bu tilda hozircha manga topilmadi</div>';
    } catch(e){ el.innerHTML = '<div class="muted">Yuklab bo\'lmadi. Qayta urinib ko\'ring.</div>'; }
  };
  fill('pop', 'followedCount'); fill('new', 'latestUploadedChapter');
}

async function viewCatalog(params){
  const q = params.get('q') || '', s = params.get('s') || (q ? 'relevance' : 'followedCount'), tag = params.get('tag') || '';
  const sorts = {relevance:'Mos', followedCount:'Mashhur', latestUploadedChapter:'Yangi', rating:'Reyting', createdAt:"Yangi qo'shilgan"};
  $app.innerHTML = `<div class="wrap">
    <form class="search" id="sf"><input name="q" value="${esc(q)}" placeholder="🔍 Nomi bo'yicha qidirish..." enterkeyhint="search">
      <select name="s">${Object.entries(sorts).map(([k,v])=>`<option value="${k}" ${k===s?'selected':''}>${v}</option>`).join('')}</select></form>
    <div class="chips" id="tags" style="margin-top:10px"></div>
    <div class="grid" id="res" style="margin-top:12px"></div><div id="mo"></div></div>`;
  const go = (over={}) => {
    const p = new URLSearchParams({q: sf.q.value, s: sf.s.value, tag, ...over});
    for (const [k,v] of [...p]) if (!v) p.delete(k);
    location.hash = '#/catalog?' + p;
  };
  const sf = document.getElementById('sf');
  sf.onsubmit = e => { e.preventDefault(); go(); };
  sf.s.onchange = () => go();
  // genre chips
  (async () => {
    try {
      if (!S.tags) S.tags = (await api('manga/tag')).data.filter(t => t.attributes.group==='genre')
        .map(t => ({id:t.id, name:t.attributes.name.en})).sort((a,b)=>a.name.localeCompare(b.name));
      const el = document.getElementById('tags'); if (!el) return;
      el.innerHTML = `<button class="chip ${!tag?'on':''}" data-t="">Hammasi</button>` + S.tags.map(t=>`<button class="chip ${t.id===tag?'on':''}" data-t="${t.id}">${esc(t.name)}</button>`).join('');
      el.onclick = e => { const b = e.target.closest('[data-t]'); if (b) { haptic(); go({tag:b.dataset.t}); } };
      const on = el.querySelector('.on'); on && on.scrollIntoView({inline:'center', block:'nearest'});
    } catch(e){}
  })();
  let offset = 0;
  const res = document.getElementById('res'), mo = document.getElementById('mo');
  const load = async () => {
    mo.innerHTML = spinner;
    try {
      let qs = listQuery(s) + `&offset=${offset}`;
      if (q) qs += '&title=' + encodeURIComponent(q);
      if (tag) qs += '&includedTags[]=' + tag;
      const d = await api(qs);
      if (!document.body.contains(res)) return;
      res.insertAdjacentHTML('beforeend', d.data.map(m => card(mangaInfo(m))).join(''));
      offset += d.data.length;
      mo.innerHTML = offset < d.total && offset < 9900 ? '<button class="btn ghost more">Ko\'proq yuklash</button>' : (offset ? '' : '<div class="center">Hech narsa topilmadi 🤷</div>');
      const b = mo.querySelector('button'); if (b) b.onclick = load;
    } catch(e){ mo.innerHTML = errBox(); }
  };
  load();
}

async function loadChapters(id){
  if (S.chapters[id]) return S.chapters[id];
  let all = [], offset = 0, total = 1;
  while (offset < total && offset < 5000) {
    const d = await api(`manga/${id}/feed?limit=500&offset=${offset}&translatedLanguage[]=${lang}&order[volume]=asc&order[chapter]=asc${RATING}&contentRating[]=erotica&includeExternalUrl=0`);
    all = all.concat(d.data); total = d.total; offset += 500;
  }
  const seen = new Set(), list = [];
  for (const c of all) {
    const a = c.attributes;
    if (a.pages === 0 || a.externalUrl) continue;
    const key = a.chapter ?? c.id;
    if (seen.has(key)) continue;
    seen.add(key);
    const label = (a.volume ? `${a.volume}-tom ` : '') + (a.chapter ? `${a.chapter}-bob` : 'Bir martalik');
    list.push({ id:c.id, label, title:a.title || '', date:a.publishAt });
  }
  return (S.chapters[id] = list);
}

async function getManga(id){
  if (S.manga[id]) return S.manga[id];
  const d = await api(`manga/${id}?includes[]=cover_art&includes[]=author`);
  return (S.manga[id] = d.data);
}

async function viewManga(id){
  $app.innerHTML = spinner;
  let m;
  try { m = await getManga(id); } catch(e){ $app.innerHTML = errBox(); return; }
  const info = mangaInfo(m), a = info.a;
  const author = (m.relationships||[]).filter(r=>r.type==='author' && r.attributes).map(r=>r.attributes.name).join(', ');
  const status = {ongoing:'Davom etmoqda', completed:'Tugallangan', hiatus:'Tanaffusda', cancelled:'To\'xtatilgan'}[a.status] || a.status;
  const favs = store.get('fav', {});
  const hist = store.get('hist', {})[id];
  $app.innerHTML = `<div class="wrap">
    <div class="hero"><div class="cv" style="background-image:url('${info.cover}')"></div>
      <div><h1>${esc(info.title)}</h1>
        <div class="muted">${esc(author)}</div>
        <div class="muted" style="margin-top:4px">${esc(status)}${a.year?' · '+a.year:''}</div></div></div>
    <div class="tags">${(a.tags||[]).filter(t=>t.attributes.group!=='format').slice(0,10).map(t=>`<span>${esc(t.attributes.name.en)}</span>`).join('')}</div>
    <div class="desc" id="desc">${esc(pick(a.description).replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/[*_#]+/g,'')) || '<span class="muted">Tavsif yo\'q</span>'}</div>
    <div class="actions"><a class="btn" id="readBtn">⏳ Yuklanmoqda...</a>
      <button class="btn ghost" id="fav">${favs[id]?'❤️':'🤍'}</button></div>
    <h2>Boblar <small id="sort">↕ Tartib</small></h2><div id="chs">${spinner}</div></div>`;
  document.getElementById('desc').onclick = function(){ this.classList.toggle('open'); };
  document.getElementById('fav').onclick = function(){
    const f = store.get('fav', {});
    if (f[id]) delete f[id]; else f[id] = { id, title:info.title, cover:info.cover, t:Date.now() };
    store.set('fav', f); this.textContent = f[id] ? '❤️' : '🤍'; haptic();
  };
  let list;
  try { list = await loadChapters(id); } catch(e){ document.getElementById('chs').innerHTML = errBox(); return; }
  const chs = document.getElementById('chs'), rb = document.getElementById('readBtn');
  if (!chs) return;
  if (!list.length) {
    const avail = (a.availableTranslatedLanguages||[]).filter(l => LANGS[l]);
    rb.textContent = '— Bob yo\'q'; rb.classList.add('ghost');
    chs.innerHTML = `<div class="center">Bu manga ${esc(LANGS[lang])} tilida hali tarjima qilinmagan.${avail.length?'<br><br>Mavjud tillar:<div class="chips" style="justify-content:center;margin-top:8px">'+avail.map(l=>`<button class="chip" onclick="setLang('${l}')">${LANGS[l]}</button>`).join('')+'</div>':''}</div>`;
    return;
  }
  const readSet = new Set(store.get('read_'+id, []));
  const target = hist && list.find(c => c.id === hist.chapterId);
  rb.textContent = target ? `▶ Davom ettirish: ${target.label}` : '▶ O\'qishni boshlash';
  rb.href = `#/read/${id}/${(target||list[0]).id}`;
  let asc = true;
  const draw = () => {
    const arr = asc ? list : [...list].reverse();
    chs.innerHTML = arr.map(c => `<a class="ch ${readSet.has(c.id)?'read':''}" href="#/read/${id}/${c.id}"><span><b>${esc(c.label)}</b>${c.title?` <span class="muted">${esc(c.title)}</span>`:''}</span><span class="muted">${c.date?new Date(c.date).toLocaleDateString('uz'):''}</span></a>`).join('');
  };
  draw();
  document.getElementById('sort').onclick = () => { asc = !asc; draw(); haptic(); };
}

async function viewReader(mid, cid){
  document.body.classList.add('hide-nav');
  $app.innerHTML = spinner;
  let list, m, server;
  try { [list, m, server] = await Promise.all([loadChapters(mid), getManga(mid), api('at-home/server/' + cid)]); }
  catch(e){ $app.innerHTML = errBox('Bobni yuklab bo\'lmadi'); return; }
  const info = mangaInfo(m);
  const i = list.findIndex(c => c.id === cid), ch = list[i] || {label:'Bob'};
  const prev = list[i-1], next = list[i+1];
  const saver = store.get('saver', false);
  const files = saver ? server.chapter.dataSaver : server.chapter.data;
  const base = `${server.baseUrl}/${saver?'data-saver':'data'}/${server.chapter.hash}/`;
  // save history
  const h = store.get('hist', {}); h[mid] = { id:mid, title:info.title, cover:info.cover, chapterId:cid, label:ch.label, t:Date.now() };
  const keys = Object.keys(h); if (keys.length > 50) delete h[keys.sort((x,y)=>h[x].t-h[y].t)[0]];
  store.set('hist', h);
  const rs = new Set(store.get('read_'+mid, [])); rs.add(cid); store.set('read_'+mid, [...rs]);
  const navBtns = `<div class="rnav">${prev?`<a class="btn ghost" href="#/read/${mid}/${prev.id}">‹ Oldingi</a>`:''}${next?`<a class="btn" href="#/read/${mid}/${next.id}">Keyingi ›</a>`:`<a class="btn ghost" href="#/manga/${mid}">✓ Oxirgi bob</a>`}</div>`;
  $app.innerHTML = `<div class="rbar"><a href="#/manga/${mid}" style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis">‹ ${esc(info.title)} · <b>${esc(ch.label)}</b></a>
      <button class="chip ${saver?'on':''}" id="sv" title="Trafikni tejash">${saver?'📉 Tejamkor':'🖼 HD'}</button></div>
    <div class="reader">${files.map((f,n)=>`<img loading="${n<3?'eager':'lazy'}" src="${img(base+f)}" alt="${n+1}" onload="this.classList.add('ok')" onerror="if(!this.dataset.r){this.dataset.r=1;this.src=this.src+'&r=1'}">`).join('')}</div>
    ${navBtns}`;
  document.getElementById('sv').onclick = () => { store.set('saver', !saver); haptic(); route(); };
  window.scrollTo(0, 0);
}

function viewLibrary(params){
  const tab = params.get('t') || 'fav';
  const items = Object.values(store.get(tab==='fav'?'fav':'hist', {})).sort((a,b)=>b.t-a.t);
  $app.innerHTML = `<div class="wrap">
    <div class="chips"><a class="chip ${tab==='fav'?'on':''}" href="#/library?t=fav">❤️ Sevimlilar</a><a class="chip ${tab==='hist'?'on':''}" href="#/library?t=hist">🕘 Tarix</a></div>
    <div class="grid" style="margin-top:14px">${items.map(x=>card(x, x.label)).join('')}</div>
    ${items.length ? (tab==='hist'?'<button class="btn ghost more" id="clr">Tarixni tozalash</button>':'') : `<div class="center">${tab==='fav'?'Hali sevimli manga yo\'q.<br>Manga sahifasida 🤍 tugmasini bosing.':'Hali hech narsa o\'qilmagan.'}</div>`}</div>`;
  const c = document.getElementById('clr');
  if (c) c.onclick = () => { store.set('hist', {}); route(); };
}

// ---------- Router ----------
function route(){
  const [path, qs] = (location.hash.slice(1) || '/').split('?');
  const parts = path.split('/').filter(Boolean), params = new URLSearchParams(qs || '');
  document.body.classList.remove('hide-nav');
  const key = parts[0] || 'home';
  document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('on', a.dataset.k === key));
  try { if (parts.length && key !== 'catalog' && key !== 'library') tg.BackButton.show(); else tg.BackButton.hide(); } catch(e){}
  if (key !== 'read') window.scrollTo(0, 0);
  if (key === 'manga') return viewManga(parts[1]);
  if (key === 'read') return viewReader(parts[1], parts[2]);
  if (key === 'catalog') return viewCatalog(params);
  if (key === 'library') return viewLibrary(params);
  return viewHome();
}
try { tg.BackButton.onClick(() => history.length > 1 ? history.back() : (location.hash = '#/')); } catch(e){}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
